<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0d1117"/>
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c6c5a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0a1a15" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crescent Moon — opening RIGHT (correct Islamic orientation) -->
  <!-- Main circle at center, cutout circle shifted RIGHT to create crescent -->
  <mask id="crescentMask">
    <rect width="512" height="512" fill="black"/>
    <circle cx="235" cy="240" r="130" fill="white"/>
    <circle cx="300" cy="230" r="110" fill="black"/>
  </mask>
  <circle cx="235" cy="240" r="130" fill="#D4AF37" mask="url(#crescentMask)" filter="url(#glow)"/>

  <!-- Star — positioned in the CENTER of the hollow (empty) area of the crescent -->
  <!-- The hollow is between the two circles, roughly at cx=310, cy=255 -->
  <polygon
    points="320,220 330,243 355,247 337,265 341,290 320,278 299,290 303,265 285,247 310,243"
    fill="#D4AF37" filter="url(#glow)"
  />
</svg>
